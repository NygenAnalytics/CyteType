<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    $meta_refresh
    <title>$message</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, #e7efff 0, transparent 45%),
                #f3f6fb;
        }

        .card {
            width: min(100%, 520px);
            padding: 42px;
            border: 1px solid #dce4f2;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 70px rgba(38, 64, 115, 0.14);
            text-align: center;
        }

        .wordmark {
            margin-bottom: 28px;
            color: #2e4169;
            font-size: 15px;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 34px;
            font-weight: 700;
        }

        .success .icon {
            color: #147a4c;
            background: #ddf7ea;
        }

        .error .icon {
            color: #b42318;
            background: #fee4e2;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(26px, 6vw, 34px);
            line-height: 1.15;
        }

        p {
            margin: 8px 0;
            color: #58647a;
            line-height: 1.6;
        }

        .lead {
            color: #344054;
            font-size: 17px;
        }

        .button {
            min-height: 46px;
            margin-top: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            border-radius: 12px;
            color: #fff;
            background: #2e4169;
            box-shadow: 0 9px 24px rgba(38, 103, 216, 0.24);
            font-weight: 700;
            text-decoration: none;
        }

        .button:hover {
            background: #1f57ba;
        }

        .button:focus-visible {
            outline: 3px solid #a9c5ff;
            outline-offset: 3px;
        }

        .countdown {
            margin-top: 20px;
            font-size: 14px;
        }

        .progress {
            height: 4px;
            margin-top: 16px;
            overflow: hidden;
            border-radius: 999px;
            background: #e8eef8;
        }

        .progress span {
            display: block;
            width: 100%;
            height: 100%;
            background: #2e4169;
            transform-origin: left;
            animation: countdown 5s linear forwards;
        }

        @keyframes countdown {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        @media (max-width: 520px) {
            .card {
                padding: 34px 24px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress span {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="card $state_class">
        <div class="wordmark">CyteType by Nygen Analytics</div>
        <div class="icon" aria-hidden="true">$icon</div>
        <h1>$message</h1>

        <section $success_hidden>
            <p class="lead">Signed in as <strong>$email</strong></p>
            <p>Your API key has been saved on this device.</p>
            <a class="button" href="$dashboard_url">Open dashboard</a>
            <p class="countdown">
                Redirecting to your dashboard in <strong>5 seconds</strong>.
            </p>
            <div class="progress" aria-hidden="true"><span></span></div>
        </section>

        <p class="lead" $error_hidden>
            Return to the terminal and try again.
        </p>
    </main>
</body>
</html>
