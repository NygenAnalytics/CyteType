[project]
name = "cytetype"
dynamic = ["version"]
description = "Python client for characterization of clusters from single-cell RNA-seq data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata~=0.12.10",
    "loguru~=0.7.3",
    "natsort~=8.4.0",
    "requests~=2.32.5",
    "pydantic~=2.12.5",
    "duckdb>=1.4.4",
    "hdf5plugin>=6.0.0",
]
authors = [
    {name = "Parashar Dhapola", email = "parashar@nygen.io"}
]
license = "BSD-3-Clause"
keywords = ["bioinformatics", "single-cell", "RNA-seq", "annotation", "cell types"]

[project.urls]
Homepage = "https://github.com/NygenAnalytics/cytetype"
Documentation = "https://docs.nygen.io/CyteType/"
Issues = "https://github.com/NygenAnalytics/cytetype/issues"
Repository = "https://github.com/NygenAnalytics/cytetype"

[project.scripts]
cytetype = "cytetype.cli:main"

[dependency-groups]
dev = [
    "jupyterlab~=4.5.4",
    "mypy~=1.19.1",
    "pytest~=9.0.2",
    "ruff~=0.14.11",
    "scanpy~=1.12",
    "igraph~=1.0.0",
    "leidenalg~=0.11.0",
    "types-requests~=2.32.4.20260107",
    "pytest-cov>=7.0.0",
]
# Builds the MyST site and the Sphinx API reference (make -C docs html), and
# executes the documentation notebooks locally (make -C docs execute-docs).
docs = [
    "mystmd>=1.11.0",
    "jupytext>=1.19.6",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=7.2.0",
    "myst-parser",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "pyyaml",
    # The Python quickstart preprocesses its example data with Scanpy and Leiden.
    "scanpy[leiden]",
    # Notebook widgets, so tqdm does not warn while executing pages.
    "ipywidgets",
]

[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cytetype*"]

[tool.setuptools.package-data]
cytetype = ["templates/*.html"]

[tool.setuptools_scm]
version_file = "cytetype/_version.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.mypy]
strict = false

python_version = "3.12"

disable_error_code = ["import-untyped"]

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

ignore_missing_imports = false

# The documentation tooling in docs/ needs the docs dependency group; its tests
# check it instead.
exclude = ["^build/", "^dist/", "^.*\\.egg-info/", "^cytetype/_version\\.py$", "^docs/"]

[[tool.mypy.overrides]]
module = ["docs.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
# The documentation tests import the tooling in docs/ from the repository root.
pythonpath = ["."]
